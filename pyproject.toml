[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-decision-models"
version = "0.1.0"
description = "Candidate-logit multimodal decision interfaces for Gemma 3n, MiniCPM-V and InternVL"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "Apache-2.0"}
dependencies = [
 "torch==2.8.0", "torchvision==0.23.0", "transformers==4.57.1",
 "pillow==11.3.0", "fastapi==0.118.0", "uvicorn==0.37.0",
 "accelerate==1.15.0", "timm==1.0.30", "einops>=0.8,<0.9",
 "sentencepiece>=0.2,<0.3", "httpx==0.28.1", "python-multipart==0.0.20"
]
[project.optional-dependencies]
dev = ["pytest==8.4.2"]
adapter = ["peft==0.17.1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
